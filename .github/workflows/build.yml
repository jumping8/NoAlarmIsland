name: Build NoAlarmIsland .deb

# 在 GitHub 托管的 Ubuntu runner 上用官方 theos 安装器交叉编译 rootless deb。
# push 到 main 或打 v* tag 时自动触发；也可在 Actions 页手动 Run workflow。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install theos (官方安装器：含交叉工具链 + patched SDK)
        timeout-minutes: 20
        run: |
          export THEOS="${{ env.THEOS }}"
          # 非 root 运行（脚本禁止 root）；runner 默认用户即非 root
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" </dev/null
          echo "theos installed at: $THEOS"
          ls "$THEOS"

      # 兜底：确保存在 iPhoneOS patched SDK（含 MobileTimer 等私有框架 tbd）
      - name: Ensure iOS SDK present
        run: |
          export THEOS="${{ env.THEOS }}"
          if ! ls "$THEOS/sdks"/*.sdk >/dev/null 2>&1; then
            echo "installer 未装上 SDK，手动拉取 iPhoneOS16.5 (patched)"
            curl -fsSL -o /tmp/ios16.5.sdk.tar.xz \
              https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
            mkdir -p "$THEOS/sdks"
            tar -xJf /tmp/ios16.5.sdk.tar.xz -C "$THEOS/sdks"
          fi
          ls "$THEOS/sdks"

      - name: Build package (rootless)
        run: |
          export THEOS="${{ env.THEOS }}"
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1
          echo "== packages =="
          ls -l packages/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoAlarmIsland-deb
          path: packages/*.deb
          if-no-files-found: error

      # 仅当推送 v* tag 时，自动创建 GitHub Release 并附上 .deb
      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
